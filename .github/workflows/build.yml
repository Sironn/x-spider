name: build and windows

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      # 拉取 develop 当前提交的完整代码。
      - name: Checkout
        uses: actions/checkout@v4

      # 使用 package.json 中声明的 pnpm@9.0.0，避免重复指定 pnpm 版本。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # 安装 Node.js，用于运行 Vite、TypeScript 和 Tauri CLI。
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # 安装 Rust 工具链。Tauri 1.x 使用 Rust 构建 Windows 原生程序。
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # 按锁定版本安装项目依赖，不修改 pnpm-lock.yaml。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 构建 Windows x64 NSIS 安装包。
      # 这里直接使用项目已有的 Tauri 配置，不修改 package.json 中的版本号。
      - name: Build Windows x64
        run: pnpm tauri build --target x86_64-pc-windows-msvc

      # 将生成的 Windows x64 安装包上传到 GitHub Actions Artifacts。
      # 本 workflow 不创建 GitHub Release。
      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: x-spider-windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
