name: Auto Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: x-spider-auto-release
  cancel-in-progress: false

jobs:
  validate-branch:
    name: Validate trigger branch
    runs-on: ubuntu-latest
    steps:
      - name: Ensure workflow is run from develop
        run: |
          if [ "$GITHUB_REF" != "refs/heads/develop" ]; then
            echo "::error::Auto Release can only be run from the develop branch."
            exit 1
          fi

  prepare-release:
    name: Merge develop and prepare release
    needs: validate-branch
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Merge develop into master and bump patch version
        id: release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin master develop
          git checkout -B master origin/master
          git merge --no-ff origin/develop -m "chore: merge develop into master for release"

          node <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          const parts = pkg.version.split('.').map(Number);

          if (parts.length !== 3 || parts.some(Number.isNaN)) {
            throw new Error(`Invalid package version: ${pkg.version}`);
          }

          parts[2] += 1;
          pkg.version = parts.join('.');
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          console.log(`Version: ${pkg.version}`);
          NODE

          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          git add package.json
          git commit -m "chore: bump version to v${VERSION}"
          git push origin master

  build-windows:
    name: Build Windows x64
    needs: prepare-release
    runs-on: windows-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows x64
        run: pnpm tauri build --target x86_64-pc-windows-msvc

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: x-spider-windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    needs: prepare-release
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - arch: arm64
            runner: macos-14
            target: aarch64-apple-darwin

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS ${{ matrix.arch }}
        run: pnpm tauri build --target ${{ matrix.target }} --bundles dmg

      - name: Upload macOS release artifact
        uses: actions/upload-artifact@v4
        with:
          name: x-spider-macos-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - prepare-release
      - build-windows
      - build-macos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: x-spider-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          gh release create "v${VERSION}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target master \
            --title "X-Spider v${VERSION}" \
            --generate-notes

  sync-version:
    name: Sync version back to develop
    needs: publish-release
    if: needs.publish-release.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Sync only package version from master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master develop
          git checkout -B develop origin/develop

          MASTER_VERSION="$(git show origin/master:package.json | node -e "let data=''; process.stdin.on('data', chunk => data += chunk).on('end', () => console.log(JSON.parse(data).version))")"
          CURRENT_VERSION="$(node -p "require('./package.json').version")"

          if [ "$CURRENT_VERSION" = "$MASTER_VERSION" ]; then
            echo "develop already has version $MASTER_VERSION; nothing to sync."
            exit 0
          fi

          MASTER_VERSION="$MASTER_VERSION" node <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.version = process.env.MASTER_VERSION;
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE

          git add package.json
          git commit -m "chore: sync version to v${MASTER_VERSION}"
          git push origin HEAD:develop
