name: Auto Release

# 正式发布：仅在开发分支 develop 上手动运行。
# 流程：锁定 SHA → CI 内写入新版本 → 三端全成功 → merge 到 master → 推版本/Tag/Release → 同步 develop。
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "版本升级级别（patch / minor / major）"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

concurrency:
  group: x-spider-auto-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate and calculate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
    steps:
      - name: Ensure workflow runs on develop
        run: |
          if [ "$GITHUB_REF" != "refs/heads/develop" ]; then
            echo "::error::Auto Release 只能在 develop 分支上运行（当前: $GITHUB_REF）。"
            exit 1
          fi

      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Calculate version and lock commit
        id: meta
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Locked source SHA: $SOURCE_SHA"

          node <<'NODE'
          const fs = require('fs');
          const bump = process.env.BUMP || 'patch';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const parts = pkg.version.split('.').map(Number);
          if (parts.length !== 3 || parts.some(n => !Number.isInteger(n) || n < 0)) {
            throw new Error(`Invalid semantic version: ${pkg.version}`);
          }
          if (!['major', 'minor', 'patch'].includes(bump)) {
            throw new Error(`Invalid bump: ${bump}`);
          }
          if (bump === 'major') {
            parts[0] += 1; parts[1] = 0; parts[2] = 0;
          } else if (bump === 'minor') {
            parts[1] += 1; parts[2] = 0;
          } else {
            parts[2] += 1;
          }
          const version = parts.join('.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          console.log(`Bump=${bump}: ${pkg.version} -> ${version}`);
          NODE

          VERSION="$(grep '^version=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2)"
          if gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::Release v${VERSION} 已存在。"
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/v${VERSION}" | grep -q .; then
            echo "::error::Tag v${VERSION} 已存在。"
            exit 1
          fi

  build-windows:
    name: Build Windows x64
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout locked commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Apply release version in workspace only
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = process.env.VERSION;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows x64
        run: pnpm tauri build --target x86_64-pc-windows-msvc

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: x-spider-windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - arch: arm64
            runner: macos-14
            target: aarch64-apple-darwin
    steps:
      - name: Checkout locked commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Apply release version in workspace only
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = process.env.VERSION;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS ${{ matrix.arch }}
        run: pnpm tauri build --target ${{ matrix.target }} --bundles dmg

      - name: Upload macOS release artifact
        uses: actions/upload-artifact@v4
        with:
          name: x-spider-macos-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Merge, tag and publish
    needs:
      - prepare
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Merge locked commit into master and publish
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin master develop
          git checkout -B master origin/master

          if ! git merge --no-ff "$SOURCE_SHA" -m "chore(release): merge develop ${SOURCE_SHA:0:7} for v${VERSION}"; then
            echo "::error::将锁定的 develop 提交合并进 master 时发生冲突，已中止发布。请人工处理后再运行。"
            git merge --abort || true
            exit 1
          fi

          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = process.env.VERSION;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE

          git add package.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): bump version to v${VERSION}"
          fi

          git push origin HEAD:master
          RELEASE_COMMIT="$(git rev-parse HEAD)"
          echo "release_commit=$RELEASE_COMMIT" >> "$GITHUB_ENV"

          git tag "v${VERSION}" "$RELEASE_COMMIT"
          git push origin "v${VERSION}"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: x-spider-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "v${VERSION}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${RELEASE_COMMIT}" \
            --title "X-Spider v${VERSION}" \
            --generate-notes

      - name: Sync version back to develop
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          git fetch origin develop
          git checkout -B develop origin/develop

          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = process.env.VERSION;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE

          git add package.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): sync version to v${VERSION}"
            git push origin HEAD:develop
          else
            echo "develop already at v${VERSION}"
          fi
